<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "PretendardX"; src: url("../../fonts/Pretendard-ExtraBold.otf"); font-weight: 800; }
  @font-face { font-family: "PretendardX"; src: url("../../fonts/Pretendard-Black.otf"); font-weight: 900; }
  @font-face { font-family: "PretendardX"; src: url("../../fonts/Pretendard-Bold.otf"); font-weight: 700; }
  :root {
    --bg: #110F18; --card: #1B1825; --border: rgba(255,255,255,0.10);
    --accent: #FFC45A; --good: #3DDC84; --bad: #FF5A5F; --text: #F4F1FA; --muted: #A49DB8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; background: transparent; overflow: hidden;
    font-family: "PretendardX", "Noto Color Emoji", sans-serif; color: var(--text); }
  #stage { position: relative; width: 1080px; height: 1140px; background: var(--bg); overflow: hidden; }
  #stage.title-mode { background: transparent; }
  #glow { position: absolute; inset: 0;
    background: radial-gradient(900px 520px at 50% 34%, rgba(255,196,90,0.10), transparent 70%); }
  #fade { position: absolute; left: 0; right: 0; bottom: 0; height: 200px;
    background: linear-gradient(to bottom, rgba(17,15,24,0), rgba(17,15,24,1) 60%); }
  #content { position: absolute; left: 0; top: 0; width: 1080px; height: var(--ch, 960px);
    display: flex; align-items: center; justify-content: center; }
  #inner { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 34px; transform-origin: center center; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 36px; }
  .kicker { font-weight: 800; font-size: 40px; color: var(--bg); background: var(--accent);
    padding: 12px 30px; border-radius: 999px; }
  .h1 { font-weight: 900; font-size: 74px; line-height: 1.18; text-align: center; letter-spacing: -1.5px; word-break: keep-all; }
  .h2 { font-weight: 800; font-size: 54px; line-height: 1.25; text-align: center; letter-spacing: -1px; word-break: keep-all; }
  .muted { color: var(--muted); }
  .acc { color: var(--accent); }
  .good { color: var(--good); } .bad { color: var(--bad); }
  .mask { display: inline-block; filter: blur(9px); background: rgba(255,255,255,0.25); color: transparent;
    border-radius: 14px; padding: 0 12px; }
  /* connect */
  .row { display: flex; align-items: center; justify-content: center; width: 100%; }
  .app { width: 340px; height: 470px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; }
  .app .ico { width: 230px; height: 230px; border-radius: 60px; display: flex; align-items: center; justify-content: center;
    font-size: 150px; background: #262236; border: 1px solid var(--border); }
  .app .lbl { font-weight: 800; font-size: 60px; text-align: center; word-break: keep-all; }
  .link { position: relative; width: 220px; height: 16px; }
  .link .line { position: absolute; left: 0; top: 4px; width: 100%; height: 8px; border-radius: 8px; background: var(--accent); transform-origin: left center; }
  .link .dot { position: absolute; top: -8px; left: 0; width: 32px; height: 32px; border-radius: 50%; background: #fff; box-shadow: 0 0 30px var(--accent); }
  .badge { position: absolute; left: 50%; top: 50%; width: 110px; height: 110px; margin: -55px 0 0 -55px; border-radius: 50%;
    background: var(--accent); color: var(--bg); font-size: 64px; display: flex; align-items: center; justify-content: center; }
  .pill { display: inline-block; font-weight: 800; font-size: 46px; padding: 16px 36px; border-radius: 999px;
    background: rgba(255,196,90,0.14); color: var(--accent); border: 2px solid rgba(255,196,90,0.5); }
  /* countup */
  .bignum { font-weight: 900; font-size: 250px; line-height: 1; color: var(--accent); letter-spacing: -6px; font-variant-numeric: tabular-nums; }
  .bignum small { font-size: 110px; letter-spacing: -2px; margin-left: 8px; }
  .bar { width: 820px; height: 34px; border-radius: 34px; background: #2A2638; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 100%; background: linear-gradient(90deg, #FFB13B, var(--accent)); transform-origin: left center; border-radius: 34px; }
  /* chat */
  .phone { width: 900px; padding: 44px 40px 36px; display: flex; flex-direction: column; gap: 30px; }
  .msg { max-width: 780px; font-weight: 800; font-size: 54px; line-height: 1.3; padding: 30px 38px; border-radius: 34px; word-break: keep-all; }
  .msg.me { align-self: flex-end; background: var(--accent); color: #1a1406; border-bottom-right-radius: 10px; }
  .msg.bot { align-self: flex-start; background: #2A2638; border-bottom-left-radius: 10px; }
  .input { display: flex; align-items: center; gap: 18px; margin-top: 8px; padding: 18px 18px 18px 30px; border-radius: 999px; background: #0E0C14; border: 1px solid var(--border); }
  .input .txt { flex: 1; font-weight: 800; font-size: 50px; min-height: 56px; white-space: nowrap; overflow: hidden; }
  .input .cur { display: inline-block; width: 4px; height: 48px; background: var(--accent); vertical-align: middle; margin-left: 4px; }
  .input .send { width: 84px; height: 84px; border-radius: 50%; background: var(--accent); color: var(--bg); font-size: 44px; display: flex; align-items: center; justify-content: center; }
  /* checklist */
  .list { width: 900px; display: flex; flex-direction: column; gap: 26px; }
  .item { display: flex; align-items: center; gap: 30px; padding: 36px 40px; }
  .item .box { flex: none; width: 76px; height: 76px; border-radius: 50%; border: 4px solid #3A3550; display: flex; align-items: center; justify-content: center; }
  .item .chk { width: 76px; height: 76px; border-radius: 50%; background: var(--good); color: #0b1f12; font-size: 48px; font-weight: 900; display: flex; align-items: center; justify-content: center; }
  .item .t { font-weight: 800; font-size: 50px; line-height: 1.22; word-break: keep-all; }
  /* before/after */
  .ba { display: flex; gap: 30px; width: 960px; align-items: stretch; min-height: 560px; }
  .col { flex: 1; padding: 40px 30px; display: flex; flex-direction: column; gap: 34px; }
  .col .hd { font-weight: 900; font-size: 60px; text-align: center; padding-bottom: 8px; }
  .col .li { display: flex; gap: 16px; align-items: flex-start; font-weight: 800; font-size: 50px; line-height: 1.25; word-break: keep-all; }
  .col .li b { flex: none; width: 54px; height: 54px; border-radius: 50%; font-size: 34px; display: flex; align-items: center; justify-content: center; }
  .col.bef { border-color: rgba(255,90,95,0.45); } .col.bef b { background: rgba(255,90,95,0.18); color: var(--bad); }
  .col.aft { border-color: rgba(61,220,132,0.5); } .col.aft b { background: rgba(61,220,132,0.18); color: var(--good); }
  .arrow { position: absolute; left: 50%; top: 50%; width: 96px; height: 96px; margin: -48px 0 0 -48px; border-radius: 50%; background: var(--accent); color: var(--bg); font-size: 56px; font-weight: 900; display: flex; align-items: center; justify-content: center; z-index: 2; }
  /* comment -> dm */
  .cmt { width: 900px; display: flex; gap: 28px; padding: 40px 40px; align-items: center; }
  .avatar { flex: none; width: 100px; height: 100px; border-radius: 50%; background: linear-gradient(135deg, #FF8A65, #BA68C8); }
  .cmt .u { font-weight: 800; font-size: 38px; color: var(--muted); }
  .cmt .c { font-weight: 900; font-size: 60px; }
  .down { font-size: 80px; color: var(--accent); line-height: 1; }
  .dm { width: 900px; padding: 40px 40px; display: flex; flex-direction: column; gap: 18px; position: relative; }
  .dm .top { display: flex; align-items: center; gap: 18px; font-weight: 800; font-size: 40px; color: var(--muted); }
  .dm .bubble { align-self: flex-start; background: #2A2638; border-radius: 30px; border-bottom-left-radius: 10px; padding: 28px 34px; font-weight: 800; font-size: 54px; line-height: 1.3; word-break: keep-all; }
  .notif { position: absolute; right: -14px; top: -26px; background: var(--bad); color: #fff; font-weight: 900; font-size: 38px; padding: 12px 26px; border-radius: 999px; }
  /* photos */
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; width: 960px; }
  .grid.n1 { grid-template-columns: 1fr; width: 760px; }
  .ph { border-radius: 30px; overflow: hidden; border: 1px solid var(--border); background: var(--card); height: 360px; }
  .grid.n1 .ph { height: 640px; } .grid.n2 .ph { height: 600px; } .grid.n3 .ph:first-child { grid-row: span 2; height: 744px; }
  .ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
  /* statement */
  .stmt { width: 900px; min-height: 620px; justify-content: center; padding: 90px 56px; display: flex; flex-direction: column; align-items: center; gap: 30px; }
  .stmt .big { font-weight: 900; font-size: 104px; line-height: 1.2; text-align: center; letter-spacing: -2px; word-break: keep-all; }
  /* title overlay (hook / cta) */
  .title { position: absolute; left: 0; top: 0; width: 1080px; display: flex; flex-direction: column; align-items: center; gap: 6px; padding-top: 10px; }
  .title .ln { font-weight: 900; font-size: var(--tfs, 92px); line-height: 1.16; letter-spacing: -2px; color: #fff; text-align: center; white-space: nowrap;
    -webkit-text-stroke: 12px #000; paint-order: stroke fill; text-shadow: 0 6px 18px rgba(0,0,0,0.55); }
  .title .ln .y { color: var(--thl, #FFE14D); }
  .title .emo { -webkit-text-stroke: 0; }
</style>
</head>
<body>
<div id="stage"><div id="glow"></div><div id="content"><div id="inner"></div></div><div id="fade"></div></div>
<script src="../node_modules/gsap/dist/gsap.min.js"></script>
<script>
(function () {
  const $ = (h) => { const d = document.createElement('div'); d.innerHTML = h.trim(); return d.firstChild; };
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  // 모르는 값은 지어내지 않고 가린다: null, "?", "{{...}}" 는 흐림 처리
  const isMask = (v) => v === null || v === undefined || v === '?' || /\{\{.*\}\}/.test(String(v));
  const T = (v) => isMask(v) ? '<span class="mask">●●●●</span>' : esc(v);
  // "**강조**" 표기는 앵버색
  const R = (v) => isMask(v) ? T(v) : esc(v).replace(/\*\*(.+?)\*\*/g, '<span class="acc">$1</span>');
  const content = document.getElementById('inner');
  let tl = null;

  // 등장 타이밍: cues(초)가 있으면 그 시각, 없으면 장면 길이에 고르게. 첫 요소는 0.3초 안에.
  function times(n, dur, cues, start) {
    start = start == null ? 0.08 : start;
    if (cues && cues.length) return Array.from({ length: n }, (_, i) => Math.max(0, cues[Math.min(i, cues.length - 1)] - 0.12));
    const span = Math.max(0.3, Math.min(dur * 0.7, n * 0.7));
    const step = n > 1 ? Math.min(0.75, span / n) : 0;
    return Array.from({ length: n }, (_, i) => start + i * step);
  }
  const rise = (el, at) => tl.fromTo(el, { y: 90, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: 'power3.out' }, at);
  const pop = (el, at) => tl.fromTo(el, { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.42, ease: 'back.out(2.6)' }, at);

  const T_ = {
    connect(d, dur) {
      const a = d.left || {}, b = d.right || {};
      content.append($(`<div class="kicker">${T(d.kicker || '연결')}</div>`));
      const row = $(`<div class="row">
        <div class="app card"><div class="ico">${T(a.icon || '📱')}</div><div class="lbl">${T(a.label)}</div></div>
        <div class="link"><div class="line"></div><div class="dot"></div><div class="badge">${T(d.badge || '⚡')}</div></div>
        <div class="app card"><div class="ico">${T(b.icon || '💬')}</div><div class="lbl">${T(b.label)}</div></div></div>`);
      content.append(row);
      if (d.caption) content.append($(`<div class="pill">${R(d.caption)}</div>`));
      const t = times(4, dur, d.cues);
      rise(content.children[0], 0); rise(row.children[0], t[0]); rise(row.children[2], t[0] + 0.15);
      tl.fromTo(row.querySelector('.line'), { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: 'power2.inOut' }, t[1]);
      tl.fromTo(row.querySelector('.dot'), { x: 0, opacity: 1 }, { x: 218, duration: 0.9, ease: 'power1.inOut', repeat: -1 }, t[1]);
      pop(row.querySelector('.badge'), t[2]);
      if (d.caption) pop(content.lastChild, t[3]);
    },
    countup(d, dur) {
      if (d.label) content.append($(`<div class="h2">${R(d.label)}</div>`));
      const num = $(`<div class="bignum"><span>${esc(d.prefix || '')}</span><span class="n">0</span><small>${esc(d.suffix || '')}</small></div>`);
      content.append(num);
      const bar = $(`<div class="bar"><i></i></div>`); content.append(bar);
      if (d.sub) content.append($(`<div class="h2 muted">${R(d.sub)}</div>`));
      const t = times(3, dur, d.cues);
      Array.from(content.children).forEach((el, i) => rise(el, i === 0 ? 0 : t[Math.min(i, 2)] - 0.05));
      const n = num.querySelector('.n');
      if (isMask(d.value)) { n.outerHTML = '<span class="mask">●●</span>'; }
      else {
        const target = Number(d.value), from = Number(d.from || 0), dec = String(d.value).includes('.') ? String(d.value).split('.')[1].length : 0;
        const o = { v: from };
        n.textContent = from.toLocaleString('ko-KR', { minimumFractionDigits: dec, maximumFractionDigits: dec });
        tl.to(o, { v: target, duration: Math.min(1.6, Math.max(0.8, dur * 0.5)), ease: 'power2.out',
          onUpdate: () => { n.textContent = o.v.toLocaleString('ko-KR', { minimumFractionDigits: dec, maximumFractionDigits: dec }); } }, t[0]);
      }
      tl.fromTo(bar.querySelector('i'), { scaleX: 0 }, { scaleX: Math.max(0.15, Math.min(1, d.bar == null ? 1 : d.bar)), duration: 1.2, ease: 'power2.out' }, t[0]);
    },
    chat(d, dur) {
      if (d.title) content.append($(`<div class="h2">${R(d.title)}</div>`));
      const ph = $(`<div class="phone card"></div>`); content.append(ph);
      const msgs = (d.messages || []).slice(-3);
      const els = msgs.map((m) => { const e = $(`<div class="msg ${m.from === 'me' ? 'me' : 'bot'}">${R(m.text)}</div>`); ph.append(e); return e; });
      const inp = $(`<div class="input"><div class="txt"><span class="tt"></span><span class="cur"></span></div><div class="send">➤</div></div>`);
      if (d.typing != null) ph.append(inp);
      const n = els.length + (d.typing != null ? 1 : 0);
      const t = times(Math.max(1, n), dur, d.cues);
      if (d.title) rise(content.children[0], 0);
      rise(ph, 0);
      els.forEach((e, i) => pop(e, t[i] + 0.1));
      if (d.typing != null) {
        const tt = inp.querySelector('.tt'), full = isMask(d.typing) ? null : String(d.typing);
        if (full === null) tt.innerHTML = '<span class="mask">●●●●●●</span>';
        else {
          const o = { p: 0 };
          tl.to(o, { p: 1, duration: Math.min(1.8, Math.max(0.6, full.length * 0.07)), ease: 'none',
            onUpdate: () => { tt.textContent = full.slice(0, Math.round(o.p * full.length)); } }, t[n - 1]);
        }
        tl.to(inp.querySelector('.cur'), { opacity: 0, duration: 0.01, repeat: -1, yoyo: true, repeatDelay: 0.4 }, 0);
      }
    },
    checklist(d, dur) {
      if (d.title) content.append($(`<div class="h1">${R(d.title)}</div>`));
      const items = (d.items || []).slice(0, 5);
      const list = $(`<div class="list"></div>`); content.append(list);
      const big = items.length <= 3;
      const els = items.map((it) => { const e = $(`<div class="item card"><div class="box"></div><div class="t" style="font-size:${big ? 64 : 54}px">${R(it)}</div></div>`); list.append(e); return e; });
      const t = times(items.length, dur, d.cues);
      if (d.title) rise(content.children[0], 0);
      els.forEach((e, i) => {
        rise(e, t[i]);
        const c = $(`<div class="chk">✓</div>`); e.querySelector('.box').append(c); pop(c, t[i] + 0.25);
      });
    },
    beforeafter(d, dur) {
      const b = d.before || {}, a = d.after || {};
      if (d.title) content.append($(`<div class="h2">${R(d.title)}</div>`));
      const ba = $(`<div class="ba" style="position:relative"></div>`); content.append(ba);
      const col = (cls, hd, items, mark) => {
        const c = $(`<div class="col card ${cls}"><div class="hd ${cls === 'bef' ? 'bad' : 'good'}">${R(hd)}</div></div>`);
        (items || []).slice(0, 4).forEach((it) => c.append($(`<div class="li"><b>${mark}</b><span>${R(it)}</span></div>`)));
        ba.append(c); return c;
      };
      const cb = col('bef', b.title || '전', b.items, '✕'), ca = col('aft', a.title || '후', a.items, '✓');
      const ar = $(`<div class="arrow">→</div>`); ba.append(ar);
      const t = times(3, dur, d.cues);
      if (d.title) rise(content.children[0], 0);
      rise(cb, t[0]); cb.querySelectorAll('.li').forEach((e, i) => rise(e, t[0] + 0.15 + i * 0.12));
      pop(ar, t[1]);
      rise(ca, t[1] + 0.1); ca.querySelectorAll('.li').forEach((e, i) => { rise(e, t[1] + 0.25 + i * 0.12); pop(e.querySelector('b'), t[1] + 0.35 + i * 0.12); });
    },
    comment_dm(d, dur) {
      const cm = $(`<div class="cmt card"><div class="avatar"></div><div><div class="u">${T(d.user || '팔로워')} · 댓글</div><div class="c">${R(d.comment || d.keyword)}</div></div></div>`);
      const dn = $(`<div class="down">⬇</div>`);
      const dm = $(`<div class="dm card"><div class="top">✉️ DM</div><div class="bubble">${R(d.dm || '보내드렸어요!')}</div><div class="notif">${T(d.badge || 'DM 도착')}</div></div>`);
      if (d.title) content.append($(`<div class="h2">${R(d.title)}</div>`));
      content.append(cm); content.append(dn); content.append(dm);
      const t = times(3, dur, d.cues);
      if (d.title) rise(content.children[0], 0);
      rise(cm, t[0]); pop(dn, t[1]); rise(dm, t[1] + 0.15); pop(dm.querySelector('.notif'), t[2] + 0.2);
    },
    photos(d, dur) {
      const imgs = (d.images || []).slice(0, 4);
      if (d.title) content.append($(`<div class="h2">${R(d.title)}</div>`));
      const g = $(`<div class="grid n${imgs.length}"></div>`); content.append(g);
      const els = imgs.map((src) => { const e = $(`<div class="ph"><img src="${esc(src)}"></div>`); g.append(e); return e; });
      if (d.caption) content.append($(`<div class="pill">${R(d.caption)}</div>`));
      const t = times(els.length + 1, dur, d.cues);
      if (d.title) rise(content.children[0], 0);
      els.forEach((e, i) => tl.fromTo(e, { y: 80, scale: 0.85, opacity: 0, rotation: i % 2 ? 3 : -3 }, { y: 0, scale: 1, opacity: 1, rotation: 0, duration: 0.5, ease: 'back.out(1.6)' }, t[i]));
      if (d.caption) pop(content.lastChild, t[els.length]);
    },
    statement(d, dur) {
      const card = $(`<div class="stmt card">${d.kicker ? `<div class="kicker">${T(d.kicker)}</div>` : ''}<div class="big">${R(d.text)}</div>${d.sub ? `<div class="h2 muted">${R(d.sub)}</div>` : ''}</div>`);
      content.append(card);
      rise(card, 0);
      Array.from(card.children).forEach((e, i) => (i === 0 && d.kicker ? pop : rise)(e, 0.1 + i * 0.25));
    },
  };

  function title(d) {
    document.getElementById('stage').className = 'title-mode';
    document.getElementById('glow').remove(); document.getElementById('fade').remove();
    document.getElementById('content').style.display = 'none';
    const hl = d.highlight || [];
    const paint = (s) => {
      let h = esc(s);
      hl.filter(Boolean).sort((a, b) => b.length - a.length).forEach((w) => { h = h.split(esc(w)).join(`\u0000${esc(w)}\u0001`); });
      return h.replace(/\u0000/g, '<span class="y">').replace(/\u0001/g, '</span>');
    };
    const box = $(`<div class="title"></div>`);
    if (d.font_size) document.documentElement.style.setProperty('--tfs', d.font_size + 'px');
    if (d.highlight_color) document.documentElement.style.setProperty('--thl', d.highlight_color);
    (d.lines || []).forEach((ln, i, arr) => {
      const e = $(`<div class="ln">${paint(ln)}${i === arr.length - 1 && d.emoji ? ` <span class="emo">${esc(d.emoji)}</span>` : ''}</div>`);
      box.append(e);
    });
    document.getElementById('stage').append(box);
    // 너무 길면 줄여서 1080 안에 맞춘다
    box.querySelectorAll('.ln').forEach((e) => { const w = e.scrollWidth; if (w > 1020) e.style.fontSize = Math.floor((d.font_size || 92) * 1020 / w) + 'px'; });
  }

  window.__build = function (d, dur, opts) {
    opts = opts || {};
    if (opts.content_h) document.documentElement.style.setProperty('--ch', opts.content_h + 'px');
    if (opts.colors) Object.entries(opts.colors).forEach(([k, v]) => document.documentElement.style.setProperty('--' + k, v));
    if (opts.stage_h) document.getElementById('stage').style.height = opts.stage_h + 'px';
    if (d.template === 'title') { title(d); return true; }
    tl = gsap.timeline({ paused: true });
    const f = T_[d.template] || T_.statement;
    f(d, dur);
    // 위쪽 칸을 꽉 채우도록 다 나온 상태 크기를 재서 확대
    tl.seek(Math.max(dur, 2) + 2, false);
    const ch = opts.content_h || 960, w = content.offsetWidth, h = content.offsetHeight;
    const s = Math.max(0.7, Math.min(1.7, 1000 / w, (ch - 70) / h));
    content.style.transform = `scale(${s.toFixed(3)})`;
    tl.seek(0, false);
    return !!T_[d.template];
  };
  window.__seek = function (t) { if (tl) tl.seek(t, false); return true; };
  window.__ready = function () { return Promise.all([document.fonts.ready].concat(Array.from(document.images).map((im) => im.complete ? 1 : new Promise((r) => { im.onload = im.onerror = r; })))); };
})();
</script>
